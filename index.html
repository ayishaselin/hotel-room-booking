<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Room Booking</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main>
        <header>
            <h1>Hotel Room Booking</h1>
            <p>
                Select your dates and choose the perfect room
                for your stay.
            </p>
        </header>
 <!-- ------------------------->.
        <section class="booking-section" aria-labelledby="stay-details-title">

    <h2 id="stay-details-title">Stay Details</h2>

    <div class="date-fields">

        <div class="form-group">
            <label for="check-in">Check-in</label>

            <input
                type="date"
                id="check-in"
                name="check-in"
            >
        </div>

        <div class="form-group">
            <label for="check-out">Check-out</label>

            <input
                type="date"
                id="check-out"
                name="check-out"
            >
        </div>

    </div>

    <p
        id="error-message"
        class="error-message"
        role="alert"
        aria-live="polite"
    ></p>

</section>
<!-------------------------------------------->.

        <section>
            <h2>Available Rooms</h2>
             <div id="room-list"></div>
        </section>

        <section>
            <h2>Booking Summary</h2>
        </section>
    </main>

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>
</html>
